services:
  - type: web
    name: mazad-tracker
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/tasks/meta/summary
    envVars:
      - key: NODE_VERSION
        value: 22
      # Secrets — set their values in the Render dashboard when prompted
      - key: MONGODB_URI
        sync: false
      # Developer link key: open the site once with ?key=<ADMIN_KEY> to unlock editing
      - key: ADMIN_KEY
        sync: false
