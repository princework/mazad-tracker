services:
  - type: web
    name: mazad-tracker
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/tasks/meta/summary
    envVars:
      - key: NODE_VERSION
        value: 22
      # Secret — set its value in the Render dashboard when prompted
      - key: MONGODB_URI
        sync: false
